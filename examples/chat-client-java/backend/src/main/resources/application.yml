server:
  port: ${SERVER_PORT:9001}

spring:
  servlet:
    multipart:
      # Spring Boot's 1MB default is too small for document uploads —
      # Python's FastAPI has no such limit at all. 20MB is generous for
      # this example's .txt/.md use case.
      max-file-size: 20MB
      max-request-size: 20MB

  application:
    name: chat-client-java

  # Java 21 virtual threads — this is what makes plain blocking RestClient
  # calls to gen-ai/Ollama/Postgres cheap under concurrency, the same role
  # Python's asyncio plays in the sibling example, without needing WebFlux.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5434/chatclient_java}
    username: ${SPRING_DATASOURCE_USERNAME:chatclient}
    password: ${SPRING_DATASOURCE_PASSWORD:chatclient}

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway owns the schema — see db/migration/V1__init.sql
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    ollama:
      base-url: ${CHAT_LLM_BASE_URL:http://127.0.0.1:11434}
      chat:
        options:
          model: ${CHAT_LLM_MODEL:llama3.2}
    openai:
      # A blank key is NOT safe here, unlike most other optional secrets in
      # this app — Spring AI's OpenAI autoconfiguration validates this
      # eagerly at context-startup bean creation (Assert.hasText), not
      # lazily at call time, so the whole app would fail to boot under
      # provider=ollama with no key set. A non-blank placeholder lets the
      # bean construct regardless of which provider is active; it only
      # matters (and correctly fails, at OpenAI's API, not Spring's) if
      # someone actually switches provider to openai without a real key.
      api-key: ${CHAT_LLM_API_KEY:not-configured}
      chat:
        options:
          model: ${CHAT_LLM_MODEL:llama3.2}

  # Both gen-ai's REST contract and this app's own API use snake_case JSON
  # (Pydantic's default) — matching that here keeps field names identical
  # to the Python sibling's raw dict responses, so someone comparing both
  # examples sees the same shapes. Java fields stay idiomatic camelCase;
  # Jackson does the translation both ways automatically.
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # gen-ai's responses have more fields than this client's DTOs
      # bother modeling (only what's actually used, e.g. just `id` off a
      # memory-create response) — same tolerance Python gets for free by
      # treating responses as plain dicts.
      fail-on-unknown-properties: false

# Everything below mirrors the Python client's own .env.example naming
# 1:1 — same concepts, same defaults, just read via Spring's relaxed
# environment-variable binding instead of pydantic-settings.
genai:
  api-url: ${GENAI_API_URL:http://127.0.0.1:8020}
  api-key: ${GENAI_API_KEY}

chat-client:
  provider: ${CHAT_LLM_PROVIDER:ollama}
  model: ${CHAT_LLM_MODEL:llama3.2}
  recent-messages-window: ${RECENT_MESSAGES_WINDOW:6}
  semantic-search-top-k: ${SEMANTIC_SEARCH_TOP_K:4}
  chunk-size-chars: ${CHUNK_SIZE_CHARS:500}
  chunk-overlap-chars: ${CHUNK_OVERLAP_CHARS:50}

logging:
  level:
    com.genai.chatclientjava: INFO
