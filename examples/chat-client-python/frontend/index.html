<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gen-ai example chat client</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 260px; background: #16181d; color: #fff; padding: 16px; box-sizing: border-box; overflow-y: auto; }
  .sidebar h2 { font-size: 14px; text-transform: uppercase; color: #999; margin: 0 0 12px; }
  .conv-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 4px; }
  .conv-item:hover, .conv-item.active { background: #2563eb; }
  .new-conv-btn { width: 100%; padding: 8px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 16px; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { background: #2563eb; color: #fff; margin-left: auto; }
  .msg.assistant { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .composer { padding: 16px 24px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { flex: 1; padding: 10px 12px; border: 1px solid #d5d8dd; border-radius: 8px; font-size: 14px; resize: none; font-family: inherit; }
  .composer button { padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .upload-row { padding: 8px 24px; background: #fafafa; border-top: 1px solid #eee; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .uploads-list { font-size: 12px; color: #666; }
  #file-input { font-size: 12px; }
  .empty-state { color: #999; text-align: center; margin-top: 60px; font-size: 14px; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <button class="new-conv-btn" onclick="createConversation()">+ New conversation</button>
    <h2>Conversations</h2>
    <div id="conv-list"></div>
  </div>
  <div class="main">
    <div class="messages" id="messages"><div class="empty-state">Select or create a conversation to start.</div></div>
    <div class="upload-row" id="upload-row" style="display:none;">
      <input type="file" id="file-input" accept=".txt,.md">
      <button onclick="uploadFile()">Upload document</button>
      <span class="uploads-list" id="uploads-list"></span>
    </div>
    <div class="composer" id="composer" style="display:none;">
      <textarea id="input" rows="2" placeholder="Type a message..."></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
const API_BASE = window.CHAT_CLIENT_API_BASE || "http://localhost:9000";
let currentConversationId = null;

async function api(path, options = {}) {
  const resp = await fetch(`${API_BASE}${path}`, options);
  if (!resp.ok) {
    const text = await resp.text();
    throw new Error(`${resp.status}: ${text}`);
  }
  return resp.json();
}

async function loadConversations() {
  const convs = await api("/conversations");
  const list = document.getElementById("conv-list");
  list.innerHTML = "";
  for (const c of convs) {
    const div = document.createElement("div");
    div.className = "conv-item" + (c.id === currentConversationId ? " active" : "");
    div.textContent = c.title || "(untitled)";
    div.onclick = () => selectConversation(c.id);
    list.appendChild(div);
  }
}

async function createConversation() {
  const { id } = await api("/conversations", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({})
  });
  await loadConversations();
  await selectConversation(id);
}

async function selectConversation(id) {
  currentConversationId = id;
  document.getElementById("composer").style.display = "flex";
  document.getElementById("upload-row").style.display = "flex";
  await loadConversations();
  await loadMessages();
  await loadUploads();
}

async function loadMessages() {
  const messages = await api(`/conversations/${currentConversationId}/messages`);
  const container = document.getElementById("messages");
  container.innerHTML = "";
  if (messages.length === 0) {
    container.innerHTML = '<div class="empty-state">No messages yet — say something.</div>';
    return;
  }
  for (const m of messages) {
    const div = document.createElement("div");
    div.className = `msg ${m.role}`;
    div.textContent = m.content;
    container.appendChild(div);
  }
  container.scrollTop = container.scrollHeight;
}

async function loadUploads() {
  const uploads = await api(`/conversations/${currentConversationId}/uploads`);
  document.getElementById("uploads-list").textContent =
    uploads.length ? uploads.map(u => `${u.filename} (${u.chunk_count} chunks)`).join(", ") : "";
}

async function sendMessage() {
  const input = document.getElementById("input");
  const content = input.value.trim();
  if (!content || !currentConversationId) return;
  input.value = "";
  input.disabled = true;
  await loadMessages(); // optimistic isn't wired; just wait for the round trip
  try {
    await api(`/conversations/${currentConversationId}/messages`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({content})
    });
  } catch (e) {
    alert("Failed to send message: " + e.message);
  }
  await loadMessages();
  input.disabled = false;
  input.focus();
}

document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

async function uploadFile() {
  const fileInput = document.getElementById("file-input");
  if (!fileInput.files.length || !currentConversationId) return;
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  try {
    const result = await fetch(`${API_BASE}/conversations/${currentConversationId}/upload`, {
      method: "POST", body: formData
    });
    if (!result.ok) throw new Error(await result.text());
    fileInput.value = "";
    await loadUploads();
  } catch (e) {
    alert("Upload failed: " + e.message);
  }
}

loadConversations();
</script>
</body>
</html>
